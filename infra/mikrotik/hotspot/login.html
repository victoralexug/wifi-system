<!doctype html>
<!--
  MikroTik hotspot login page: sends every unauthenticated customer to the YourWiFi portal,
  passing what the portal needs to log the device in after payment.
  Replace PORTAL_HOST before uploading to the router's "yourwifi" hotspot folder.
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="0; url=https://PORTAL_HOST/?mac=$(mac-esc)&ip=$(ip)&link-login-only=$(link-login-only-esc)&link-orig=$(link-orig-esc)$(if error)&error=$(error)$(endif)">
<title>YourWiFi</title>
</head>
<body style="font-family: system-ui, sans-serif; text-align: center; padding: 48px 16px;">
<p>Opening YourWiFi…</p>
<p><a href="https://PORTAL_HOST/?mac=$(mac-esc)&ip=$(ip)&link-login-only=$(link-login-only-esc)&link-orig=$(link-orig-esc)">Tap here if nothing happens</a></p>
</body>
</html>
