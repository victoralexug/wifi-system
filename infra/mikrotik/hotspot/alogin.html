<!doctype html>
<!-- Shown by the router after a successful login: continue to what the customer originally wanted. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="2; url=$(if link-redirect)$(link-redirect)$(else)https://www.google.com$(endif)">
<title>Connected</title>
</head>
<body style="font-family: system-ui, sans-serif; text-align: center; padding: 48px 16px;">
<h2>You're online</h2>
<p>Enjoy browsing. Your time is running.</p>
</body>
</html>
